<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>contact</h1>
    <p id="fff"></p>
    <p id="fff2"></p>
    <p id="fff3"></p>
    <script language = "javascript" type = "text/javascript">
        let contact1={
            name:"kevin",
            phone:1234567890,
            email:"kevin@gmail.com",
            getinfo:function(){
                return(contact1.name+" "+contact1.phone+" "+contact1.email+"<br>")
            },
        };
        document.getElementById("fff2").innerHTML=contact1.getinfo();
        function printContactInfo(contact){
            document.getElementById("fff").innerHTML+=contact.getinfo();
        }
        printContactInfo(contact1);

        let contact2={
            name:"nandana",
            phone:123334567890,
            email:"nandana@gmail.com",
            getinfo:function(){
                return(contact2.name+" "+contact2.phone+" "+contact2.email+"<br>")
            },
        };
        document.getElementById("fff3").innerHTML=contact2.getinfo();
         printContactInfo(contact2);
    </script>
</body>
</html>
