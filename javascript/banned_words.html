<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language = "javascript" type = "text/javascript">
        var str= "I think this movie was BAD and 100% Stupid! But the Acting was Amazing and 3 actors were great and ugly."
        var patt1 = /(Bad|stupid|ugly)/gi;
        var reo=str.replace(patt1,"***")
        document.write(str+"<br>")
        document.write(reo+"<br>")
        var numb=/\d/g
        var nummbb=str.match(numb)
        document.write("count of number:"+nummbb.length+"<br>")
        var caps=/\b[A-Z]/g
        var capss=str.match(caps)
        document.write("count of capital letters:"+capss.length+"<br>")

    </script>
</body>
</html>
