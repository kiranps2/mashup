<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>statistics</h1>
    <p id="demo"></p>

<script>
function getrandom(){
return Math.floor(Math.random() * 100) + 1;
}
var ran=getrandom()
document.write(ran+"<br>")
userscore='75'
numm=Number(userscore)
diff=ran-numm
document.write(userscore+" ")
document.write(typeof userscore+"<br>")
document.write(typeof numm+"<br>")
document.write("difference="+diff+"<br>")
document.write("square="+Math.sqrt(numm)+"<br>")
document.write("pi="+Math.PI+"<br>")
document.write('50'*2+"<br>")


</script>
</body>
</html>
