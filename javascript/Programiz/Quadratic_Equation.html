<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language = "javascript" type = "text/javascript">
        var a=Number(prompt("enter the 1st number"))
        var b=Number(prompt("enter the 2nd number"))
        var c=Number(prompt("enter the 3rd number"))
        var discriminant =b*b-4*a*c
        if(discriminant>0){
            var root1=(-b+Math.sqrt(discriminant))/(2*a)
            var root2=(-b-Math.sqrt(discriminant))/(2*a)
            document.write("root1="+root1+"<br>")
            document.write("root2="+root2+"<br>")

        }
        else if(discriminant==0){
            var root3=((-b)/2*a)
            document.write("root="+root3+"<br>")
        }
        else{
            var realpart=((-b)/2*a).toFixed(2)
            var imagipart=Math.sqrt(-discriminant)/2*a.toFixed(2)
            document.write("real part+imaginary part="+realpart+" + "+imagipart+"i"+"<br>")
            document.write("real part+imaginary part="+realpart+" - "+imagipart+"i"+"<br>")

        }
    </script>
</body>
</html>
