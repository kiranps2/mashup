<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language = "javascript" type = "text/javascript">
        var a=Number(prompt("Enter a starting number"))
        var b=Number(prompt("Enter a ending number"))
        
        for(var i=a;i<=b;i++){
            var isprime=true
            for(var j=2;j<i;j++){
                if(i%j===0){
                    isprime=false
                    break
                }
            }
            
            if(isprime && i>1){
                document.write(i+"<br>")
            }
            else{
                isprime=true
            }
        }
    </script>
</body>
</html>
