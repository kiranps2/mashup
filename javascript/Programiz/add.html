<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language = "javascript" type = "text/javascript">
        var a=2
        var b=5
        var c=a+b
        document.write(a+"+"+b+"="+c+"<br>")
        document.write("square of "+c+" ="+Math.sqrt(c)+"<br>")
        document.write("area of a triangle with sides "+a+" and "+b+" is "+((a*b)/2)+"<br>")
        var temp=a
        a=b
        b=temp
        document.write("a="+a+"<br>")
        document.write("b="+b+"<br>")
    </script>
</body>
</html>
