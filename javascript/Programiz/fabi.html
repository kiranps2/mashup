<html lang="en">
<head>

</head>
<body>
   <script language = "javascript" type = "text/javascript">
    var a=Number(prompt("enter the number"))
    var n1=0,n2=1,nextterm;
    for(var i=0;i<=a;i++){
        document.write(n1+"<br>")
        nextterm=n1+n2
        n1=n2
        n2=nextterm
    }
   </script> 
</body>
