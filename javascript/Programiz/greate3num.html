<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language = "javascript" type = "text/javascript">
        var a=Number(prompt("enter the 1st number"))
        var b=Number(prompt("enter the 2nd number"))
        var c=Number(prompt("enter the 3rd number"))
        if(a>b && a>c){
            document.write("a is greater="+a+"<br>")

        }
        else if(b>a && b>c){
            document.write("b is greater="+b+"<br>")

        }
        else{
            document.write("c is greater="+c+"<br>")

        }

    </script>
</body>
</html>
