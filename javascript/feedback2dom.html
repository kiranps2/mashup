        <textarea name="" id="feedback"></textarea>

    <p id="con" onmouseover="mover()" onmouseout="mout()"></p>

    <script language = "javascript" type = "text/javascript">

            var myname=document.getElementById("name").value
            var myfeed=document.getElementById("feedback").value
            document.getElementById("con").innerHTML="hello "+myname+" your feedback is stored "+myfeed
            
            conformation()

        function mover(){
            document.getElementById("con").style.color = "blue";
            }
            function mout(){
                document.getElementById("con").style.color = "black";
            }
        function conformation() {
  document.getElementById("thanks").innerHTML = "Thanks for your feedback!"

    }, 5000); 
}
