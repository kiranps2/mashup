<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Document</title>
    <style>
        body{
            background-color:#0dcaf0;
        }
    </style>
</head>
<body>
    
        <div class="bg-light m-5 p-4" >
        <h1>Sign Up</h1>
    <p>Please fill in this form to create an account!</p>
    <form>
  <div class="row">
    <div class="col">
      <input type="text" class="form-control mb-3" placeholder="First Name" name="fname" style="background-color: #deddd9;">
    </div>
    <div class="col">
      <input type="text" class="form-control" placeholder="Last Name" name="lname" style="background-color: #deddd9;">
    </div>
  </div>
  <div class="form-group">
    <!-- <label for="exampleInputEmail1">Email address</label> -->
    <input type="email" style="background-color: #deddd9;" class="form-control mb-3" id="exampleInputEmail1"   placeholder="Email" aria-describedby="emailHelp">
  </div>
  <div class="form-group">
    <!-- <label for="exampleInputPassword1">Password</label> -->
    <input type="password" style="background-color: #deddd9;" class="form-control mb-3"  placeholder="Password" id="exampleInputPassword1">
  </div>
  <div class="form-group">
    <!-- <label for="exampleInputPassword1">Password</label> -->
    <input type="password" class="form-control mb-3" style="background-color: #deddd9;"  placeholder="Conform Password" id="exampleInputPassword1">
  </div>
  <div class="form-group form-check">
    <input type="checkbox" class="form-check-input" style="background-color: #deddd9;" id="exampleCheck1">
    <label class="form-check-label mb-3" for="exampleCheck1">I accept the terms of Use & Privacy Policy</label>
  </div>
  <button type="button" class="btn btn-primary w-25 fw-bold" data-bs-toggle="button" autocomplete="off">Sign Up</button>

</form>
</div>
    <p class="d-flex justify-content-center position-relative text-white" style="top:-38px;">Already have an account?<a href="#" class="text-white">Login here</a></p>
</body>"
</html>
